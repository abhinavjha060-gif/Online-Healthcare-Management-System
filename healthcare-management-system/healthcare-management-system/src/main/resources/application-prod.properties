# Activate with: java -jar app.jar --spring.profiles.active=prod
# Used when deploying online (Render / Railway / any VPS) with a real MySQL database.
# Set these as environment variables on your hosting platform:
#   DATABASE_URL      e.g. jdbc:mysql://<host>:3306/<dbname>
#   DATABASE_USERNAME
#   DATABASE_PASSWORD

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

server.port=${PORT:8080}
