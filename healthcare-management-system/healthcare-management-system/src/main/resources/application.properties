spring.application.name=Online Healthcare Management System

# ---- Default database: file-based H2 ----
# No install needed - a "data/hms.mv.db" file is created next to the jar the first time you run it.
# This is what makes the app work immediately on any machine, like a normal desktop app.
spring.datasource.url=jdbc:h2:file:./data/hms;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Handy web-based DB viewer at /h2-console (JDBC URL above, user sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
