<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Doctor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<form class="form-box" th:action="@{/admin/doctors/new}" method="post">
    <h2>Add New Doctor</h2>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullName" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required minlength="6">
    </div>
    <div class="form-group">
        <label>Specialization</label>
        <input type="text" name="specialization" placeholder="e.g. Cardiologist" required>
    </div>
    <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Create Doctor Account</button>
</form>
</body>
</html>
